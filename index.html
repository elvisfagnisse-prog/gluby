<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=800,H=450,GR=360,WW=2400;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();
const K={l:0,r:0,j:0},km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',Space:'j',KeyW:'j'};
addEventListener('keydown',e=>{if(km[e.code]){K[km[e.code]]=1;e.preventDefault();}});
addEventListener('keyup',e=>{if(km[e.code])K[km[e.code]]=0;});
function hold(id,k){const el=document.getElementById(id),on=e=>{K[k]=1;e.preventDefault()},off=e=>{K[k]=0;e.preventDefault()};
 ['touchstart','mousedown'].forEach(v=>el.addEventListener(v,on,{passive:false}));
 ['touchend','touchcancel','mouseup','mouseleave'].forEach(v=>el.addEventListener(v,off,{passive:false}));}
hold('bl','l');hold('br','r');hold('bj','j');
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();tap((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);});

/* ---- sons ---- */
let AC=null,MG=null,vol=.7,vt=0,paused=false,muted=false,mt=null,mi=0;
function audio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();MG=AC.createGain();MG.gain.value=vol;MG.connect(AC.destination);}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function slide(f1,f2,d,ty,v,dl){const a=audio();if(!a||muted)return;const t=a.currentTime+(dl||0),o=a.createOscillator(),gn=a.createGain();o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,20),t+d);gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+.015);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(MG);o.start(t);o.stop(t+d+.03);}
function note(f,d,ty,v,dl){slide(f,f,d,ty,v,dl);}
const sfx={jump(){slide(280,720,.18,'sine',.25)},land(){slide(220,70,.14,'triangle',.3)},
 giggle(){[900,1100,950,1250].forEach((f,i)=>note(f,.07,'square',.06,i*.08))},
 door(){[523,659,784,1047].forEach((f,i)=>note(f,.22,'triangle',.2,i*.12))},
 win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>note(f,.25,'triangle',.22,i*.13))},
 lose(){slide(500,60,.6,'sine',.3);slide(320,50,.6,'triangle',.2,.05)}};
const mel=[262,330,392,330,294,349,440,349,262,330,392,523,494,392,330,294];
function startM(){if(mt||muted)return;mt=setInterval(()=>{if(muted||paused||document.hidden)return;const f=mel[mi++%mel.length];note(f,.3,'triangle',.05);if(mi%4===1)note(f/2,.6,'sine',.06);},330);}
function stopM(){clearInterval(mt);mt=null;}
['pointerdown','keydown','touchend','click'].forEach(ev=>addEventListener(ev,()=>{audio();startM();},{passive:true}));
function setVol(d){vol=Math.max(.1,Math.min(1,Math.round((vol+d)*10)/10));audio();if(MG)MG.gain.value=vol;vt=90;note(660,.1,'sine',.25);}
const pz=document.getElementById('pz');
function togglePause(){if(scr==='play'){paused=!paused;pz.textContent=paused?'▶️':'⏸️'}}
pz.addEventListener('click',togglePause);
document.getElementById('vp').addEventListener('click',()=>setVol(.1));
document.getElementById('vm').addEventListener('click',()=>setVol(-.1));
addEventListener('keydown',e=>{if(e.code==='KeyP'||e.code==='Escape')togglePause()});
const sb=document.getElementById('snd');
sb.addEventListener('click',()=>{muted=!muted;sb.textContent=muted?'🔇':'🔊';if(muted)stopM();else{audio();startM();}});

/* ---- niveaux: [nom, options, indice] ---- */
const L=[
["Le drapeau qui s’enfuit",{flee:1,slow:[[350,90,'#e8b87a']]},"Il recule quand tu avances… coince-le !"],
["Le sol gâteau",{slow:[[300,220,'#e8b87a']]},"Ne reste pas collé dans le gâteau."],
["La porte peureuse",{flee:1,slow:[[250,180,'#e8b87a']]},"La porte fuit, et le sol est collant."],
["Le nuage moqueur",{cloud:1,slow:[[300,100,'#e8b87a']]},"Saute sous le nuage pour le faire pleuvoir."],
["Le biscuit géant",{chase:1.7,slow:[[400,160,'#fff']]},"Entraîne-le dans la mare de lait !"],
["Le pont de chocolat",{plank:[[220,0],[275,1],[330,0],[385,0],[440,1],[495,0]],fake:[600]},"Écoute : un bruit grave, c’est une mauvaise planche."],
["La forêt de bonbons",{tree:1,slow:[[220,100,'#5ad46a'],[500,100,'#5ad46a']]},"Les arbres déplacent la porte. Retrouve-la !"],
["Finale : le grand parcours",{slow:[[200,140,'#e8b87a'],[420,120,'#fff']],chase:1.6,flee:1},"Tous les pièges du chapitre !"],

["Le toboggan de glace",{ice:1,peng:1},"Ça glisse, et les pingouins te bousculent !"],
["L’usine à jouets",{belt:[[250,160,-1],[480,150,1]]},"Les tapis changent de sens."],
["La bibliothèque géante",{words:[[240,'SAUTE'],[400,'GLISSE']],sp:[540],fake:[640]},"Méfie-toi des mots que tu touches."],
["La pieuvre géante",{chase:1.4,sp:[300,460],reset:1},"Évite les flèches. La porte te joue un tour."],

["Finale : la grande fête",{ice:1,peng:1,fake:[420],sp:[300,520],reset:1},"Tous les pièges du chapitre !"],
["La planète sucrette",{slow:[[300,120,'#ff9ad5']],met:[550]},"Une météorite tombe : repère son ombre."],
["Pluie de météores",{met:[250,420,600]},"Écarte-toi de l’ombre au sol !"],
["Gravité légère",{lowg:[[200,260],[700,260]],met:[400,560],slow:[[320,100,'#ff9ad5']]},"Dans la bulle violette, tu sautes très haut."],
["La comète glissante",{ice:1,met:[300,480,660],belt:[[220,140,1]]},"Ça glisse, et les météores tombent."],
["Le robot géant",{chase:2,met:[320,520],lowg:[[260,220]],slow:[[420,120,'#9aa5b1']]},"Il te suit : sois plus rapide, ou saute par-dessus."],
["Les portes de l’espace",{fake:[260,420,600],met:[340,520],dark:1},"Plein de fausses portes, et il fait noir."],
["La station spatiale",{pot:[[160,'r'],[260,'v'],[360,'b']],pipe:[480],met:[300,560],belt:[[560,160,-1]]},"Potions, tuyau et météores."],
["Finale : le grand voyage",{ice:1,peng:1,chase:2.1,fake:[360],met:[280,430,600],lowg:[[500,180]],reset:1},"Tous les pièges de l’espace !"]];
L.forEach(l=>{const o=l[1],R=[0,800,1600];
 ['fake','sp','pipe','met'].forEach(k=>{if(o[k])o[k]=R.flatMap(d=>o[k].map(x=>x+d))});
 ['slow','belt','plank','words','pot','lowg'].forEach(k=>{if(o[k])o[k]=R.flatMap(d=>o[k].map(z=>[z[0]+d,...z.slice(1)]))});});
L.forEach((l,i)=>{const o=l[1],n=Math.min(18,Math.round(1+i*1.2));o.sp=(o.sp||[]).concat(Array.from({length:n},(_,j)=>Math.round(300+(j+.5)*(1850/n)+((j*37)%40))));});

let scr='menu',lv=0,prog=0,g,fails=0,conf=[];
let sh=0,ci=0;const COL=['#2f8fff','#ff4f4f','#ff9a2f','#ffd93b','#5ad46a','#1fbf9f','#4fd8ff','#9a6bff','#d65bff','#ff7ac8','#ff5a8a','#8b5a2b','#ffffff','#9aa5b1','#222a35','#b8ff3b'];
let unl=0;try{sh=+localStorage.getItem('glubySh')||0;ci=+localStorage.getItem('glubyCi')||0;unl=+localStorage.getItem('glubyUnl')||0}catch(e){}
if(!unl){if(sh!==0&&sh!==5)sh=0;if(ci!==0&&ci!==3)ci=0}
const lockS=i=>!unl&&i!==0&&i!==5,lockC=j=>!unl&&j!==0&&j!==3;
let ST=Array(24).fill(0);try{const s=JSON.parse(localStorage.getItem('glubySt'));if(Array.isArray(s))ST=s.concat(Array(24).fill(0)).slice(0,24)}catch(e){}
function savL(){try{localStorage.setItem('glubySh',sh);localStorage.setItem('glubyCi',ci);localStorage.setItem('glubyUnl',unl)}catch(e){}}
try{prog=+localStorage.getItem('gluby')||0}catch(e){}
function setScr(s){scr=s;paused=false;const z=document.getElementById('pz');z.textContent='⏸️';z.style.display=s==='play'?'flex':'none';document.getElementById('btns').style.display=s==='play'?'flex':'none';}
function start(i){lv=i;fails=0;reset();setScr('play');}
function reset(){g={x:60,y:GR-30,vx:0,vy:0,w:34,h:30,onG:1,sq:0,f:1,t:0,gauge:100,dx:WW-100,cor:0,rs:0,lg:-99,cx:600,rain:0,ch:-80,fc:0,st:'play',tm:0,pg:[],wc:0,pt:'',ptt:0,cm:0,kn:0,cj:0,dead:0,tr:0};}
function fail(){if(g.st!=='play')return;g.st='lose';g.tm=70;fails++;sfx.lose();}
function win(){if(g.st!=='play')return;g.st='win';g.vy=-9;sfx.win();ST[lv]=Math.max(ST[lv],fails<=1?3:fails<=4?2:1);try{localStorage.setItem('glubySt',JSON.stringify(ST))}catch(e){}if(lv+1>prog){prog=lv+1;try{localStorage.setItem('gluby',prog)}catch(e){}}
 conf=[];for(let i=0;i<70;i++)conf.push({x:Math.random()*W,y:-Math.random()*400,v:2+Math.random()*3,c:'hsl('+Math.random()*360+',90%,60%)',r:3+Math.random()*5});setScr('end');}
function update(){
 const o=L[lv][1],p=g;
 if(p.st==='lose'){if(--p.tm<=0)reset();return}
 if(p.st==='win'){p.vy+=.6;p.y+=p.vy;if(p.y>=GR-p.h){p.y=GR-p.h;p.vy=-9}return}
 p.t++;const cx=p.x+p.w/2;
 let sl=0;(o.slow||[]).forEach(z=>{if(p.onG&&cx>z[0]&&cx<z[0]+z[1])sl=1});
 const acc=o.ice?.3:.6,fr=o.ice?.97:.82,mx=sl?1.9:4.2;
 if(K.l){p.vx-=acc;p.f=-1}if(K.r){p.vx+=acc;p.f=1}
 p.vx=Math.max(-mx,Math.min(mx,p.vx*fr));
 if(K.j&&p.onG){p.vy=p.pt==='r'?-15:-11.5;p.onG=0;p.sq=-.3;sfx.jump()}
 let gv=.6;(o.lowg||[]).forEach(z=>{if(cx>z[0]&&cx<z[0]+z[1])gv=.22});p.vy+=p.pt==='v'?.15:gv;if(p.pt==='v'&&p.vy>1.5)p.vy=1.5;p.x+=p.vx;p.y+=p.vy;if(p.ptt>0&&--p.ptt===0)p.pt='';
 (o.belt||[]).forEach(z=>{if(p.onG&&cx>z[0]&&cx<z[0]+z[1])p.x+=z[2]*1.7});
 p.x=Math.max(0,Math.min(WW-p.w,p.x));
 if(p.y>=GR-p.h){if(!p.onG){p.sq=.35;sfx.land()}p.y=GR-p.h;p.vy=0;p.onG=1}
 p.sq*=.85;if(sl)p.gauge-=.25;
 if(o.flee&&!p.cor){const d=p.dx-p.x;if(p.vx>.5&&d>0&&d<300){p.dx+=2.4;if(p.t-p.lg>45){p.lg=p.t;sfx.giggle()}}
  if(p.dx>=WW-50){p.dx=WW-50;if(p.dx-p.x<110){p.cor=1;sfx.door()}}}
 (o.sp||[]).forEach(x=>{const ph=(p.t+x)%160;if(ph>95&&ph<135&&p.onG&&Math.abs(cx-x)<18)p.gauge=0});
 if(o.chase&&!p.dead){let s=o.chase;(o.slow||[]).forEach(z=>{if(p.ch>z[0]&&p.ch<z[0]+z[1]){s*=.3;p.cm++}});p.ch+=s;if(p.ch<p.x-600)p.ch=p.x-600;if(p.cj>0)p.cj--;if(p.cm>70||p.kn>=3){p.dead=1;sfx.win()}
  if(!p.dead&&Math.abs(p.ch-cx)<30){if(p.y>GR-p.h-22)p.gauge=0;else if(!p.cj){p.cj=45;p.kn++}}}
 if(o.cloud){p.cx+=Math.sign(cx-p.cx)*.9;if(p.rain>0)p.rain--;
  if(Math.abs(cx-p.cx)<45){p.gauge-=.2;if(!p.onG&&p.vy<-4){p.rain=50;p.cx=-500}}}
 if(p.fc>0)p.fc--;
 (o.fake||[]).forEach(x=>{if(!p.fc&&p.onG&&Math.abs(cx-(x+23))<26){p.gauge-=50;p.fc=60;p.x=Math.max(0,p.x-90);sfx.land()}});
 if(p.onG&&Math.abs(cx-(p.dx+23))<28&&(!o.flee||p.cor)){if(o.reset&&!p.rs){p.rs=1;p.dx=30;sfx.giggle()}else win()}
 (o.plank||[]).forEach(([x,b])=>{const d=cx-x;if(p.onG&&d>-50&&d<0&&p.vx>.5&&!p['pk'+x]){p['pk'+x]=1;note(b?150:700,.12,'square',.08)}if(p.onG&&b&&d>=0&&d<48&&!p.fc){p.gauge-=50;p.fc=60;p.x=Math.max(0,x-70);sfx.lose()}});
 if(o.tree){p.tr++;if(p.tr%300===0){p.dx=[700,1300,1900,WW-100][Math.floor(Math.random()*4)];sfx.door()}}
 if(o.peng){if(p.t%200===100)p.pg.push(p.x+W);p.pg=p.pg.map(x=>x-3.2).filter(x=>x>-40);p.pg.forEach(x=>{if(Math.abs(x-cx)<26&&p.onG&&!p.fc){p.vx=-10;p.fc=30;sfx.land()}})}
 (o.words||[]).forEach(([x,w])=>{if(p.onG&&!p.wc&&Math.abs(cx-(x+30))<34){p.wc=60;if(w==='SAUTE'){p.vy=-12;p.onG=0;sfx.jump()}else{p.vx=9;sfx.giggle()}}});if(p.wc>0)p.wc--;
 (o.pot||[]).forEach(q=>{if(!p['g'+q[0]]&&Math.abs(cx-q[0])<22&&p.y>GR-p.h-40){p['g'+q[0]]=1;p.pt=q[1];p.ptt=600;sfx.door()}});
 (o.pipe||[]).forEach(x=>{if(p.pt!=='b'&&Math.abs(cx-x)<22){p.x-=p.vx+(p.vx>=0?1:-1);p.vx=0}});
 if(o.dark){p.sx=(p.sx||cx)+(cx-(p.sx||cx))*.03;if(Math.abs(cx-p.sx)>110)p.gauge-=.5}
 (o.met||[]).forEach(x=>{const ph=(p.t+x*3)%220;if(ph>164&&ph<176&&Math.abs(cx-x)<24)p.gauge=0});
 if(p.gauge<=0)fail();
}
function np(i){const c=i>>3,k=i%8,col=k<4?k:7-k;return[c*265+48+col*58,k<4?190:300]}
function tap(x,y){if(paused){if(x>250&&x<550){if(y>150&&y<210)resume();else if(y>240&&y<300)setScr('menu')}return}
 if(scr==='buy'){buyTap2(x,y);return}if(scr==='gl'){glTap(x,y);return}if(scr==='menu'){if(x<150&&y<60){setScr('gl');return}for(let i=0;i<24;i++){const[a,b]=np(i);if(i<=prog&&Math.hypot(x-a,y-b)<26){start(i);return}}}
 else if(scr==='end'&&y>320&&y<390){if(x>150&&x<390){lv<23?start(lv+1):setScr('menu')}else if(x>410&&x<650)setScr('menu')}
}
function door(x,c){ctx.fillStyle=c||'#ff7ac8';ctx.beginPath();ctx.roundRect(x,GR-80,46,80,[23,23,0,0]);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+36,GR-40,4,0,7);ctx.fill();const b=Math.sin(performance.now()/200)*6;ctx.fillStyle='#ffd93b';ctx.beginPath();ctx.moveTo(x+23,GR-105+b);ctx.lineTo(x+11,GR-125+b);ctx.lineTo(x+35,GR-125+b);ctx.fill();}
function flag(x){ctx.fillStyle='#fff';ctx.fillRect(x,GR-90,4,90);ctx.fillStyle='#ff4f9a';ctx.beginPath();ctx.moveTo(x+4,GR-90);ctx.lineTo(x+54,GR-72);ctx.lineTo(x+4,GR-54);ctx.fill();}
function gluby(p){const k=p.pt==='b'?.6:p.pt==='r'?1.3:1,h=p.h*k*(1-p.sq),w=p.w*k*(1+p.sq),cx=p.x+p.w/2,by=p.y+p.h;
 ctx.fillStyle=COL[ci];shp(cx,by-h/2,w/2+4,h/2+2);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(cx-6,by-h/2-6,8,5,-.4,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-6+p.f*3,by-h/2-2,7,0,7);ctx.fill();ctx.beginPath();ctx.arc(cx+8+p.f*3,by-h/2-2,7,0,7);ctx.fill();
 ctx.fillStyle='#123';ctx.beginPath();ctx.arc(cx-6+p.f*5,by-h/2-2,3,0,7);ctx.fill();ctx.beginPath();ctx.arc(cx+8+p.f*5,by-h/2-2,3,0,7);ctx.fill();
 ctx.strokeStyle='#123';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx+p.f*2,by-h/2+6,5,.1,3);ctx.stroke();}
function bg(c){if(c){ctx.fillStyle=c==2?'#06122e':'#1a1040';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<30;i++)ctx.fillRect((i*97)%W,(i*53)%200,2,2)}
 else{ctx.fillStyle='#7ec8ff';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.9)';[[120,70],[420,50],[640,95]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.arc(x+26,y+6,20,0,7);ctx.arc(x-24,y+6,18,0,7);ctx.fill()})}
 ctx.fillStyle=c==2?'#2a4a8a':c?'#4a2c7a':'#ff9ad5';ctx.fillRect(0,GR,W,H-GR);ctx.fillStyle=c==2?'#4a6ab0':c?'#6a43a8':'#ffc2e6';ctx.fillRect(0,GR,W,10);}
function drawPlay(){
 const o=L[lv][1],p=g,c=lv>>3,cam=Math.max(0,Math.min(WW-W,p.x-300));bg(c);ctx.save();ctx.translate(-cam,0);
 (o.slow||[]).forEach(z=>{ctx.fillStyle=z[2];ctx.fillRect(z[0],GR-6,z[1],16)});
 (o.belt||[]).forEach(z=>{ctx.fillStyle='#333';ctx.fillRect(z[0],GR-4,z[1],14);ctx.fillStyle='#ffd93b';ctx.font='bold 16px sans-serif';ctx.textAlign='left';for(let x=z[0]+8;x<z[0]+z[1]-10;x+=26)ctx.fillText(z[2]>0?'›':'‹',x,GR+8)});
 (o.fake||[]).forEach(x=>door(x,'#c99ad5'));
 (o.sp||[]).forEach(x=>{const ph=(p.t+x)%160;if(ph>60){const h=ph>95&&ph<135?36:10;ctx.fillStyle=h>20?'#d8d8e8':'#ff6a6a';ctx.beginPath();ctx.moveTo(x-14,GR);ctx.lineTo(x,GR-h);ctx.lineTo(x+14,GR);ctx.fill()}});
 if(o.chase&&!p.dead){ctx.fillStyle=c?'#b05aff':'#d9a85a';ctx.beginPath();ctx.arc(p.ch,GR-24,24,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.ch+8,GR-30,6,0,7);ctx.fill();ctx.beginPath();ctx.arc(p.ch-6,GR-30,6,0,7);ctx.fill()}
